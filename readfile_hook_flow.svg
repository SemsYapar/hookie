<svg width="680" height="484" viewBox="0 0 680 484" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>ReadFile hook akışı</title>
<desc>ReadFile çağrısı yakalanır, ilk çağrıda sahte veri enjekte edilir, sonraki çağrılarda dosya sonu simüle edilir, her durumda True dönülür.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="210" y="40" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">ReadFile() çağrısı</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">test.txt okunurken yakalanır</text>

<line x1="340" y1="96" x2="340" y2="156" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="210" y="156" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="174" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Bu oturumda ilk okuma mı?</text>
<text x="340" y="192" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">one_shot bayrağıyla takip edilir</text>

<path d="M340 212 L340 242 L205 242 L205 272" fill="none" stroke="#D85A30" stroke-width="1" marker-end="url(#arrow)"/>
<text x="205" y="236" text-anchor="middle" font-size="12" fill="#444441">evet</text>
<path d="M340 212 L340 242 L475 242 L475 272" fill="none" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
<text x="475" y="236" text-anchor="middle" font-size="12" fill="#444441">hayır</text>

<rect x="80" y="272" width="250" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="205" y="290" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#4A1B0C">Sahte tampon enjekte edilir</text>
<text x="205" y="308" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">"this is a hooked text"</text>

<rect x="350" y="272" width="250" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="475" y="290" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">Sıfır byte bildirilir</text>
<text x="475" y="308" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">dosya sonu simüle edilir</text>

<path d="M205 328 L205 358 L340 358 L340 388" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M475 328 L475 358 L340 358 L340 388" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="210" y="388" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="406" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Çağırana True döner</text>
<text x="340" y="424" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">okuma başarılı görünür</text>
</svg>
