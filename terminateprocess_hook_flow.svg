<svg width="680" height="584" viewBox="0 0 680 584" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<title>TerminateProcess hook akışı</title>
<desc>TerminateProcess çağrısı yakalanır, PID NtQueryInformationProcess ile çözülür, OpenProcess ile handle açılır, GetModuleBaseNameW ile isim okunur, chrome.exe ise sonlandırma engellenir, değilse orijinal fonksiyon çalışır.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="200" y="40" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">TerminateProcess çağrısı</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">orijinal çalışmadan önce yakalanır</text>

<line x1="340" y1="96" x2="340" y2="152" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="200" y="152" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="170" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">PID bulunur</text>
<text x="340" y="188" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">NtQueryInformationProcess ile handle'dan</text>

<line x1="340" y1="208" x2="340" y2="264" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="200" y="264" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="282" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">OpenProcess çağrılır</text>
<text x="340" y="300" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">bulunan PID ile yeni bir handle açılır</text>

<line x1="340" y1="320" x2="340" y2="376" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="200" y="376" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="394" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">İşlem adı okunur</text>
<text x="340" y="412" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">GetModuleBaseNameW ile, chrome.exe mi?</text>

<path d="M340 432 L340 460 L205 460 L205 488" fill="none" stroke="#D85A30" stroke-width="1" marker-end="url(#arrow)"/>
<text x="205" y="454" text-anchor="middle" font-size="12" fill="#444441">chrome.exe</text>
<path d="M340 432 L340 460 L475 460 L475 488" fill="none" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
<text x="475" y="454" text-anchor="middle" font-size="12" fill="#444441">diğer işlem</text>

<rect x="80" y="488" width="250" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="205" y="506" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#4A1B0C">Sonlandırma engellenir</text>
<text x="205" y="524" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">return 1, gerçek çağrı yapılmaz</text>

<rect x="350" y="488" width="250" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="475" y="506" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">Orijinal fonksiyon çağrılır</text>
<text x="475" y="524" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">gerçek TerminateProcess çalışır</text>
</svg>
