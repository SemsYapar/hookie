name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Cross-compile the Windows stub DLLs (x64 + x86) with MinGW-w64 so the
      # wheel ships known-good prebuilt stubs. Then a Windows user without a C
      # compiler can `create-dll` out of the box. (Linux stubs are deliberately
      # not prebuilt — glibc symbol versions are tied to the build host — so they
      # keep compiling on the user's machine.)
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64

      - name: Build prebuilt Windows stubs
        run: |
          x86_64-w64-mingw32-gcc -shared -O2 \
            -o hookie/stubs/x64-windows/hookie_stub.dll \
            hookie/stubs/x64-windows/hookie_stub.c
          i686-w64-mingw32-gcc -shared -O2 \
            -o hookie/stubs/x86-windows/hookie_stub.dll \
            hookie/stubs/x86-windows/hookie_stub.c

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build
        run: python -m build

      - name: Verify prebuilt stubs are in the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          for arch in ("x64", "x86"):
              want = f"hookie/stubs/{arch}-windows/hookie_stub.dll"
              assert any(n.endswith(want) for n in names), f"missing {want} in {whl}"
          print("prebuilt Windows stubs present in", whl)
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1